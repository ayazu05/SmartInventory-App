<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Stock Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="theme-dark">

    <div id="appSplashLoader" class="splash-screen">
        <div class="splash-content">
            <h2>Ai Stock Manager</h2>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <header class="app-header">
        <div class="header-left">
            <button id="btnOpenMenu" class="icon-btn"><i class="fas fa-bars-staggered"></i></button>
            <div class="brand"><span>Ai Stock Manager</span></div>
        </div>
        <div class="header-right">
            <div class="status-pill green"><span class="dot"></span> Live Cloud</div>
            <button class="avatar-btn" onclick="switchTab('profile')"><i class="fas fa-user-gear"></i></button>
        </div>
    </header>

    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <aside id="menuDrawer" class="menu-drawer pos-left">
        <div class="drawer-header">
            <div class="drawer-brand"><i class="fas fa-layer-group"></i> Navigation</div>
            <button id="btnCloseMenu" class="icon-btn"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="drawer-profile-preview">
            <div class="preview-avatar"><i class="fas fa-user"></i></div>
            <div class="preview-info">
                <h4 id="menuUserName">User Name</h4>
                <p id="menuUserFarm">Farm Name</p>
            </div>
        </div>
        <nav class="drawer-nav">
            <button class="nav-item active" onclick="switchTab('stocks'); closeMenu();"><i class="fas fa-boxes-stacked"></i> Dashboard & Stocks</button>
            <button class="nav-item" onclick="handleStockIn(); closeMenu();"><i class="fas fa-plus"></i> Quick Stock IN</button>
            <div class="nav-divider"></div>
            <button class="nav-item" onclick="switchTab('profile'); closeMenu();"><i class="fas fa-id-card"></i> Profile</button>
            <button class="nav-item logout-btn" onclick="logoutUser()"><i class="fas fa-power-off"></i> Sign Out</button>
        </nav>
    </aside>

    <main class="main-content">
        <section id="tabStocks" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info"><span class="stat-label">Total Items</span><h3 id="statTotalItems">0</h3></div>
                </div>
                <div class="stat-card">
                    <div class="stat-info"><span class="stat-label">Total Stock Qty</span><h3 id="statTotalQty">0</h3></div>
                </div>
            </div>
            <div class="action-bar">
                <button class="btn btn-stock-in" onclick="handleStockIn()"><i class="fas fa-plus"></i> Stock IN</button>
            </div>
            <div class="search-bar-card">
                <input type="text" id="searchInput" placeholder="Search item..." oninput="filterInventory()">
            </div>
            <div id="stockListContainer" class="stock-list"></div>
        </section>

        <section id="tabProfile" class="tab-content">
            <div class="card profile-card">
                <h2>User Profile</h2>
                <div class="form-grid">
                    <input type="text" id="profName" disabled placeholder="Name">
                    <input type="text" id="profFarm" disabled placeholder="Farm Name">
                    <input type="text" id="profPhone" disabled placeholder="Phone">
                </div>
            </div>
        </section>
    </main>

    <!-- AUTH OVERLAY WITH OTP STEP -->
    <div id="authOverlay" class="modal-overlay">
        <div class="modal-card glassmorphism">
            <div class="auth-header">
                <h2>Phone Authentication</h2>
            </div>

            <!-- Phone Input View -->
            <div id="authPhoneView" class="auth-view">
                <div class="input-group">
                    <label>Mobile Phone Number</label>
                    <input type="tel" id="authPhoneInput" placeholder="10 Digit Number (e.g. 7011162050)">
                </div>
                <!-- Invisible Recaptcha Container -->
                <div id="recaptcha-container"></div>
                <button class="btn btn-primary btn-full mt-2" onclick="sendOTP()">Send OTP</button>
            </div>

            <!-- OTP Input View -->
            <div id="authOtpView" class="auth-view hidden">
                <div class="input-group">
                    <label>Enter 6-Digit Verification Code</label>
                    <input type="number" id="authOtpInput" placeholder="------">
                </div>
                <button class="btn btn-primary btn-full mt-2" onclick="verifyOTP()">Verify OTP & Login</button>
                <p class="auth-switch-text mt-2"><span onclick="resetAuthView()">Change Number</span></p>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div id="modalDetails" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Add Stock Item</h3>
            <input type="text" id="prodName" placeholder="Item Name">
            <input type="number" id="prodQty" placeholder="Quantity">
            <button class="btn btn-primary" onclick="uploadToCloudProcess()">Save</button>
            <button class="btn btn-secondary" onclick="requestCancel('modalDetails')">Cancel</button>
        </div>
    </div>

    <div id="successPopUp" class="toast-popup hidden">
        <span id="popUpMessage">Done</span>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
